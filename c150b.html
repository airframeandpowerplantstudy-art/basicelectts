<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cessna 150B — 3D Model</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #cbd7e0; font-family: sans-serif; }
    canvas { display: block; }
    #label {
      position: fixed; left: 14px; top: 12px; color: #18232b;
      background: #ffffffbb; padding: 8px 11px; border-radius: 5px;
      font-size: 14px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="label">Cessna 150B · Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd7e0);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 24;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x697580, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.3);
    sun.position.set(5, 10, 7);
    sun.castShadow = true;
    scene.add(sun);

    const white = new THREE.MeshStandardMaterial({ color: 0xf0eee6, roughness: 0.62 });
    const red = new THREE.MeshStandardMaterial({ color: 0xb91f28, roughness: 0.55 });
    const glass = new THREE.MeshStandardMaterial({
      color: 0x263f4c, roughness: 0.22, metalness: 0.15,
      transparent: true, opacity: 0.78
    });
    const rubber = new THREE.MeshStandardMaterial({ color: 0x17191a, roughness: 0.9 });
    const metal = new THREE.MeshStandardMaterial({ color: 0x92999a, metalness: 0.7, roughness: 0.35 });

    const aircraft = new THREE.Group();
    scene.add(aircraft);

    // Tapered fuselage, longitudinal axis is X; nose points toward +X.
    function fuselage() {
      const rings = [
        [-3.25, 0.18, 0.22, 1.10],
        [-2.65, 0.32, 0.34, 1.10],
        [-1.60, 0.43, 0.43, 1.12],
        [-0.35, 0.48, 0.46, 1.15],
        [ 0.75, 0.39, 0.40, 1.14],
        [ 1.75, 0.26, 0.30, 1.12],
        [ 2.75, 0.13, 0.19, 1.10],
        [ 3.15, 0.07, 0.12, 1.10]
      ];
      const vertices = [], indices = [], sides = 16;
      for (const [x, ry, rz, zc] of rings) {
        for (let j = 0; j < sides; j++) {
          const a = 2 * Math.PI * j / sides;
          vertices.push(x, zc + rz * Math.sin(a), ry * Math.cos(a));
        }
      }
      for (let i = 0; i < rings.length - 1; i++) {
        for (let j = 0; j < sides; j++) {
          const a = i * sides + j, b = i * sides + (j + 1) % sides;
          indices.push(a, b, a + sides, b, b + sides, a + sides);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      g.setIndex(indices);
      g.computeVertexNormals();
      aircraft.add(new THREE.Mesh(g, white));
    }
    fuselage();

    function box(name, size, position, material, bevel = 0) {
      const g = new THREE.BoxGeometry(...size);
      const m = new THREE.Mesh(g, material);
      m.position.set(...position);
      m.castShadow = true;
      m.receiveShadow = true;
      aircraft.add(m);
      return m;
    }

    function beam(a, b, radius, material, sides = 8) {
      const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
      const delta = end.clone().sub(start);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, delta.length(), sides),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      mesh.castShadow = true;
      aircraft.add(mesh);
      return mesh;
    }

    // High wing: broad, slightly tapered, with thin airfoil-like slab.
    function wingPanel(side) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.05, 0);
      shape.lineTo(0.18, 0);
      shape.lineTo(0.02, 4.85);
      shape.lineTo(-0.25, 4.85);
      shape.closePath();
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.12, bevelEnabled: false
      });
      const mesh = new THREE.Mesh(geometry, white);
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(-0.75, 2.62, side * 0.06);
      mesh.scale.set(1, 1, side);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      aircraft.add(mesh);
    }
    wingPanel(1);
    wingPanel(-1);

    // Wing struts.
    for (const s of [-1, 1]) {
      beam([-1.05, 1.28, s * 0.36], [-0.78, 2.57, s * 3.55], 0.055, metal);
    }

    // Tailplane and vertical fin.
    box("tailplane", [0.72, 0.10, 2.35], [2.55, 1.25, 0], white);
    const fin = new THREE.Shape();
    fin.moveTo(1.95, 1.28);
    fin.lineTo(3.02, 1.28);
    fin.lineTo(3.12, 2.48);
    fin.lineTo(2.72, 2.56);
    fin.lineTo(2.52, 1.62);
    fin.closePath();
    const finMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(fin, {
      depth: 0.12, bevelEnabled: false
    }), white);
    finMesh.position.z = -0.06;
    aircraft.add(finMesh);

    // Red fuselage stripe and red fin tip.
    box("sideStripe", [4.8, 0.16, 0.018], [0.02, 1.23, 0.445], red);
    box("otherStripe", [4.8, 0.16, 0.018], [0.02, 1.23, -0.445], red);
    box("finTip", [0.62, 0.10, 0.135], [2.72, 2.47, 0], red);

    // Cabin glazing: angled front windshield and side windows.
    const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.62, 0.74), glass);
    windshield.position.set(-1.17, 1.68, 0);
    windshield.rotation.z = -0.35;
    aircraft.add(windshield);
    for (const s of [-1, 1]) {
      const sideWindow = new THREE.Mesh(new THREE.BoxGeometry(1.10, 0.43, 0.035), glass);
      sideWindow.position.set(-0.36, 1.75, s * 0.425);
      aircraft.add(sideWindow);
      const rearWindow = new THREE.Mesh(new THREE.BoxGeometry(0.63, 0.34, 0.035), glass);
      rearWindow.position.set(0.62, 1.68, s * 0.36);
      aircraft.add(rearWindow);
    }

    // Propeller hub and two blades at the nose.
    const hub = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), metal);
    hub.position.set(-3.35, 1.1, 0);
    aircraft.add(hub);
    for (const angle of [0.45, Math.PI + 0.45]) {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.95, 0.10), metal);
      blade.position.set(-3.38, 1.1, 0);
      blade.rotation.x = angle;
      aircraft.add(blade);
    }

    // Fixed tricycle gear, wheels oriented across the aircraft.
    function wheel(x, y, z, radius = 0.28, width = 0.17) {
      const w = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, width, 20),
        rubber
      );
      w.rotation.x = Math.PI / 2;
      w.position.set(x, y, z);
      w.castShadow = true;
      aircraft.add(w);
      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.42, radius * 0.42, width + 0.02, 16),
        metal
      );
      hub.rotation.x = Math.PI / 2;
      hub.position.copy(w.position);
      aircraft.add(hub);
    }
    for (const s of [-1, 1]) {
      beam([-0.75, 1.02, s * 0.32], [-0.45, 0.40, s * 0.72], 0.045, metal);
      wheel(-0.45, 0.30, s * 0.72, 0.28);
    }
    beam([-2.30, 1.00, 0], [-2.55, 0.34, 0], 0.045, metal);
    wheel(-2.58, 0.25, 0, 0.22, 0.14);

    // Ground.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x87908b, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    camera.lookAt(0, 1.1, 0);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
