<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approximate Cessna 150B</title>
  <style>
    body { margin: 0; overflow: hidden; background: #b9d4e8; }
    #label {
      position: fixed; top: 12px; left: 14px; color: #172532;
      font: 14px system-ui, sans-serif; background: #ffffffbb;
      padding: 8px 11px; border-radius: 6px;
    }
  </style>
</head>
<body>
<div id="label">Approximate Cessna 150B exterior · drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d4e8);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8, 6, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x647080, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 3.0);
sun.position.set(5, 10, 6);
sun.castShadow = true;
scene.add(sun);

const white = new THREE.MeshStandardMaterial({ color: 0xe9e7da, roughness: 0.55 });
const red = new THREE.MeshStandardMaterial({ color: 0xb52820, roughness: 0.5 });
const glass = new THREE.MeshStandardMaterial({
  color: 0x183b4c, metalness: 0.25, roughness: 0.2
});
const metal = new THREE.MeshStandardMaterial({ color: 0x858b8c, metalness: 0.7 });
const tire = new THREE.MeshStandardMaterial({ color: 0x202124, roughness: 0.85 });
const propMat = new THREE.MeshStandardMaterial({ color: 0x25282a, metalness: 0.5 });

function ellipsoid(name, pos, scale, mat, segments=32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 20), mat);
  mesh.name = name;
  mesh.position.set(...pos);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function rod(name, a, b, radius, mat) {
  const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(end, start);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, dir.length(), 12), mat
  );
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// Fuselage runs nose (+X) to tail (-X).
ellipsoid("Fuselage", [0, 1.35, 0], [2.45, 0.38, 0.36], white);
ellipsoid("Nose cowl", [1.85, 1.38, 0], [0.62, 0.34, 0.34], white);
ellipsoid("Tail taper", [-2.25, 1.36, 0], [0.95, 0.19, 0.20], white);

// Red side stripe, both sides.
for (const s of [-1, 1]) {
  ellipsoid("Fuselage stripe", [-0.15, 1.43, s*0.347], [1.55, 0.045, 0.025], red);
}

// Main wing: tapered planform with a slight dihedral.
function makeWing() {
  const span = 5.05, sections = 20, verts = [], indices = [];
  for (let i=0; i<=sections; i++) {
    const t = i/sections, z = -span + 2*span*t;
    const f = Math.abs(z)/span;
    const chord = 1.62*(1-f) + 0.92*f;
    const sweep = 0.16*f;
    const xLead = -0.70 - sweep;
    const y = 2.05 + 0.12*f;
    const thick = 0.105*(1-0.45*f);
    // Leading/trailing top and bottom vertices.
    verts.push(
      xLead, y+thick, z, xLead+chord, y+thick, z,
      xLead, y-thick, z, xLead+chord, y-thick, z
    );
  }
  for (let i=0; i<sections; i++) {
    const a=i*4, b=(i+1)*4;
    for (const [u,v] of [[0,1],[2,3],[0,2],[1,3]]) {
      indices.push(a+u,a+v,b+v, a+u,b+v,b+u);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  const wing = new THREE.Mesh(g, white);
  wing.name = "Main high wing";
  wing.material.side = THREE.DoubleSide;
  wing.castShadow = true;
  wing.receiveShadow = true;
  scene.add(wing);
}
makeWing();

// Red wingtip caps.
for (const s of [-1, 1])
  ellipsoid("Wingtip", [-0.72, 2.13, s*4.91], [0.42, 0.075, 0.18], red);

// Horizontal tailplane and elevator.
ellipsoid("Horizontal stabilizer", [-2.55, 1.52, 0], [0.58, 0.075, 1.48], white);
ellipsoid("Elevator", [-2.92, 1.52, 0], [0.24, 0.065, 1.43], red);

// Vertical fin and rudder.
ellipsoid("Vertical fin", [-2.55, 1.78, 0], [0.56, 0.48, 0.075], white);
ellipsoid("Rudder", [-2.84, 1.82, 0], [0.30, 0.39, 0.085], red);

// Cockpit glazing on both sides.
for (const s of [-1, 1]) {
  ellipsoid("Front side window", [0.55, 1.68, s*0.345], [0.43, 0.20, 0.045], glass);
  ellipsoid("Rear side window", [-0.38, 1.67, s*0.33], [0.40, 0.19, 0.045], glass);
}
// Windscreen
ellipsoid("Windscreen", [1.00, 1.70, 0], [0.20, 0.24, 0.27], glass);

// Main landing gear, wheels and hubs.
for (const s of [-1, 1]) {
  rod("Main gear leg", [0.20, 1.12, s*0.22], [0.43, 0.36, s*0.79], 0.045, metal);
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.09, 12, 28), tire);
  wheel.name = "Main tire";
  wheel.position.set(0.43, 0.31, s*0.84);
  wheel.rotation.y = Math.PI/2;
  wheel.castShadow = true;
  scene.add(wheel);
  ellipsoid("Wheel hub", [0.43, 0.31, s*0.91], [0.10, 0.10, 0.035], metal);
}

// Nose gear and tire.
rod("Nose gear leg", [1.35, 1.08, 0], [1.55, 0.32, 0], 0.045, metal);
const nw = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.065, 12, 24), tire);
nw.name = "Nose tire";
nw.position.set(1.57, 0.23, 0);
nw.rotation.y = Math.PI/2;
nw.castShadow = true;
scene.add(nw);

// Two-blade propeller at the nose.
ellipsoid("Propeller hub", [2.48, 1.38, 0], [0.13, 0.13, 0.13], metal);
for (const angle of [0, Math.PI]) {
  const blade = ellipsoid("Propeller blade", [2.55, 1.38, 0], [0.07, 0.66, 0.095], propMat);
  blade.rotation.x = angle;
}

// Simple door handles and exhausts.
for (const s of [-1, 1]) {
  ellipsoid("Door handle", [-0.55, 1.28, s*0.36], [0.07, 0.025, 0.025], metal);
  rod("Exhaust", [1.42, 1.14, s*0.25], [1.80, 1.14, s*0.25], 0.035, metal);
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x68766d, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
